<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Startup Law Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
/* VOICE: high-energy performance brand: bold, confident, minimal.
   IDEA: an athletic training programme for founders; volumes are training blocks on a rack.
   PICTURE: the rack of dark volumes with lime lettering; lime ribbon = progress.
   COLOUR and TYPE: near-black #111112, bone #F5F5F0, electric lime #AEF02E; Archivo expanded black caps + Archivo.
   LAYOUT: dark sticky bar, dark hero with giant caps and lime pill CTA, bone sections washed with lime glow. */
:root{color-scheme:light dark;
 --bg:light-dark(#F5F5F0,#111112);--paper:light-dark(#ffffff,#1b1b1d);--ink:light-dark(#111112,#F5F5F0);
 --mute:light-dark(#5f5a50,#a7a39a);--line:light-dark(rgba(10,10,10,.1),rgba(245,245,240,.13));
 --ox:#111112;--ox2:light-dark(#067A50,#AEF02E);--gold:#AEF02E;--stamp:#ff4d2e;--ok:light-dark(#067A50,#AEF02E)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Archivo,system-ui,sans-serif;font-stretch:104%;overflow-x:clip}
h1,h2,h3{font-family:Archivo,system-ui,sans-serif;text-wrap:balance;margin:0}
h1,h2{font-stretch:125%;font-weight:900;text-transform:uppercase;letter-spacing:-.03em;line-height:.92}
h1{font-size:clamp(36px,6.4vw,84px)}h2{font-size:clamp(24px,3.4vw,40px)}h3{font-size:19px;font-weight:700;font-stretch:110%;line-height:1.2}
a{color:inherit}
.band{padding:clamp(28px,5vw,72px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
pre,.scroll{overflow-x:auto}code{overflow-wrap:anywhere}html{scroll-padding-top:120px}
.top{position:sticky;top:0;z-index:5;background:#111112;color:#F5F5F0;border-bottom:1px solid #ffffff14}
.top .wrap{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:12px max(5vw,16px)}
.brand{font:900 18px Archivo,sans-serif;font-stretch:125%;text-transform:uppercase;letter-spacing:-.02em;text-decoration:none;white-space:nowrap}
.brand::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-left:6px;vertical-align:middle}
.q{flex:1 1 260px;font:16px Archivo,sans-serif;padding:11px 18px;border:1px solid #ffffff26;border-radius:999px;background:#1e1e20;color:#F5F5F0;min-height:44px}
.q::placeholder{color:#9b978e}
nav.scroll{display:flex;gap:4px;padding:0 max(5vw,16px) 10px;max-width:1240px;margin:0 auto}
nav a{flex:none;text-decoration:none;padding:9px 14px;border-radius:999px;font-size:14px;font-weight:500;color:#cfcbc2;min-height:40px}
nav a:hover{color:#fff}
nav a[aria-current=page]{background:var(--gold);color:#0a0a0a;font-weight:700}
.hero{background:radial-gradient(900px 520px at 85% 10%,#aef02e33,transparent 60%),#111112;color:#F5F5F0}
.eyebrow{font:600 12px Archivo,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#a7a39a;margin:0 0 18px;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:28px;height:1px;background:currentColor}
.hero .eyebrow{max-width:none;margin:0 0 18px}.hero p{max-width:60ch;color:#cfcbc2;margin:18px 0 0;font-size:17px}
.status{margin-top:16px;font-size:14px;color:#a7a39a}.status b{color:var(--gold)}.status a{color:#F5F5F0}
.cta{display:inline-flex;align-items:center;gap:14px;margin-top:26px;background:var(--gold);color:#0a0a0a;border-radius:999px;padding:16px 18px 16px 30px;font:900 15px Archivo,sans-serif;font-stretch:125%;text-transform:uppercase;text-decoration:none;min-height:52px}
.cta::after{content:"→";display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#111112;color:var(--gold);font-size:15px}
.shelf{display:flex;align-items:flex-end;gap:clamp(6px,1vw,12px);margin-top:34px;padding:0 4px;border-bottom:10px solid var(--gold);min-height:320px}
.spine{position:relative;flex:1 1 0;max-width:180px;border:1px solid #ffffff1a;border-bottom:0;cursor:pointer;border-radius:14px 14px 0 0;color:#F5F5F0;
 background:linear-gradient(90deg,#0006 0,#fff1 20%,#0000 45%,#0004 100%),var(--c);padding:22px 0 16px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;transition:transform .25s,color .25s}
.spine:hover,.spine:focus-visible{transform:translateY(-12px);color:var(--gold)}.spine:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.spine .bands{width:62%;height:3px;background:var(--gold);border-radius:2px;opacity:.9}
.spine .t{writing-mode:vertical-rl;transform:rotate(180deg);font:900 clamp(13px,1.6vw,18px)/1 Archivo,sans-serif;font-stretch:125%;text-transform:uppercase;letter-spacing:-.01em;max-height:200px;text-align:center}
.spine .v{padding-right:12px;font:700 12px Archivo,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#a7a39a}
.rib{position:absolute;top:0;right:6px;width:8px;background:var(--gold);border-radius:0 0 4px 4px}
.glow{background:radial-gradient(900px 600px at 100% 0,light-dark(#aef02e8c,#aef02e22),transparent 65%),radial-gradient(700px 500px at 0 0,light-dark(#d9d9d4,#1b1b1d),transparent 70%),var(--bg)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:clamp(20px,3vw,48px)}
@media(max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.list{list-style:none;margin:0;padding:0}.list li{padding:16px 0;border-bottom:1px solid var(--line)}
.meta{font-size:13px;color:var(--mute)}
.kicker{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0 0 8px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:22px 24px;margin:0 0 16px}
.stamp{display:inline-block;font:700 11px Archivo,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border:1.5px solid currentColor;border-radius:999px;white-space:nowrap}
.st-closed{color:var(--stamp)}.st-narrow{color:light-dark(#8a6400,#f0c64a)}.st-good{color:var(--ok)}
.new{background:var(--gold);color:#0a0a0a;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px;letter-spacing:.04em;text-transform:uppercase}
.btn{font:700 14px Archivo,sans-serif;letter-spacing:.04em;text-transform:uppercase;min-height:46px;padding:12px 20px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#0a0a0a}
.btn:disabled{opacity:.5}
.btn:focus-visible,.q:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,.chip:focus-visible,.leaf:focus-visible,.cta:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px}
.chip{font:600 14px Archivo,sans-serif;padding:9px 16px;min-height:42px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
details.les{border-bottom:1px solid var(--line);padding:6px 0}
details.les summary{cursor:pointer;list-style:none;padding:14px 0;display:flex;gap:12px;align-items:baseline}
details.les summary::-webkit-details-marker{display:none}
details.les summary h3{flex:1}
details.les summary::after{content:"+";font:700 20px Archivo,sans-serif;color:var(--mute)}details.les[open] summary::after{content:"−"}
.tick{color:var(--ok);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.body p{max-width:70ch}.kp{background:var(--paper);border-left:4px solid var(--gold);padding:12px 18px;margin:16px 0;border-radius:0 14px 14px 0}
.kp ul{margin:6px 0;padding-left:18px}
.src{font-size:14px}.src a{color:var(--ox2)}
.sec h4{margin:14px 0 2px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700}
.sec p{margin:0 0 4px;max-width:72ch}
.tl{list-style:none;padding:0;margin:8px 0;border-left:2px solid var(--line)}
.tl li{padding:4px 0 4px 14px;position:relative}.tl li::before{content:"";position:absolute;left:-6px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px var(--ink)}
.tl b{font-variant-numeric:tabular-nums;white-space:nowrap}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line)}
.stat b{font:900 30px Archivo,sans-serif;font-stretch:125%;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--gold)}
.opt{display:flex;width:100%;text-align:left;margin:10px 0;padding:14px 20px;text-transform:none;letter-spacing:0;font-weight:500;font-size:16px;border-radius:16px;border-width:1px;border-color:var(--line);background:var(--paper)}
.opt.right{border-color:var(--ok);box-shadow:inset 5px 0 var(--ok)}.opt.wrong{border-color:var(--stamp);box-shadow:inset 5px 0 var(--stamp)}
.flash{min-height:280px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;background:#111112;color:#F5F5F0;border-color:#111112}
.flash h3{font-size:clamp(22px,3.4vw,34px);font-weight:900;font-stretch:125%;text-transform:uppercase;letter-spacing:-.02em;line-height:1}
.flash .kicker,.flash .meta{color:#a7a39a}
.chat{display:flex;flex-direction:column;gap:12px;margin:16px 0}
.msg{white-space:pre-wrap;padding:14px 18px;border-radius:18px;max-width:78ch}
.msg.u{align-self:flex-end;background:#111112;color:#F5F5F0}.msg.a{background:var(--paper);border:1px solid var(--line)}
textarea{width:100%;font:16px Archivo,sans-serif;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--paper);color:var(--ink);min-height:90px}
select{font:16px Archivo,sans-serif;min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.note{font-size:13px;color:var(--mute);margin-top:18px}
.banner{background:var(--paper);border:1px solid var(--line);padding:12px 16px;border-radius:14px;margin-bottom:16px}
footer{background:#111112;color:#a7a39a}
.mm{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:22px 64px;align-items:center;margin-top:24px}
.mm>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mm-col{display:flex;flex-direction:column;gap:18px;position:relative}
.mm-root{position:relative;width:190px;height:190px;border-radius:50%;display:grid;place-items:center;text-align:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),#ffffff1f 0);padding:12px}
.mm-root>div{width:100%;height:100%;border-radius:50%;background:#111112;color:#F5F5F0;display:grid;place-content:center;padding:12px;font:800 12px/1.2 Archivo,sans-serif;font-stretch:120%;text-transform:uppercase;letter-spacing:.04em}
.mm-root b{display:block;font:900 40px Archivo,sans-serif;font-stretch:125%;color:var(--gold);margin-top:4px;letter-spacing:-.03em}
.mm-br{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:18px;padding:12px 16px}
.mm-col.L .mm-br{border-left-width:1px;border-right:5px solid var(--gold)}
.mm-head{display:flex;justify-content:space-between;gap:10px;width:100%;background:none;border:0;padding:4px 0;color:var(--ink);font:800 14px Archivo,sans-serif;font-stretch:115%;text-transform:uppercase;letter-spacing:.01em;cursor:pointer;text-align:left;min-height:36px}
.mm-head span{font:700 12px Archivo,sans-serif;color:var(--mute);white-space:nowrap}.mm-head .nm{font:inherit;color:inherit;white-space:normal}
.leaves{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.leaf{font:500 13px/1.3 Archivo,sans-serif;padding:6px 12px;border-radius:999px;border:1px dashed var(--mute);text-decoration:none;color:var(--ink);min-height:32px;display:inline-flex;align-items:center}
.leaf.on{background:var(--gold);border:1px solid var(--gold);color:#0a0a0a}
.mm-wrap{background:radial-gradient(700px 400px at 50% 50%,#aef02e26,transparent 70%),#111112;border-radius:28px;padding:clamp(16px,3vw,36px)}
.mm-wrap .mm-br{background:var(--bg)}
@media(max-width:860px){.mm{grid-template-columns:minmax(0,1fr)}.mm>svg{display:none}.mm-root{margin:0 auto;order:-1}.mm-col.L .mm-br{border-right-width:1px;border-left:5px solid var(--gold)}}
@media(max-width:600px){.shelf{min-height:250px}.spine .t{max-height:150px}.spine .v{font-size:10px;letter-spacing:.06em}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
 <div class="wrap"><a class="brand" href="#home">Startup Law Library</a>
  <input id="q" class="q" type="search" placeholder="Search law, cases, loopholes, tax…" aria-label="Search the library" autocomplete="off"></div>
 <nav class="scroll" id="nav" aria-label="Sections">
  <a href="#home">Library</a><a href="#map">Mindmap</a><a href="#founders">Founder playbook</a><a href="#cases">Cases</a><a href="#gaps">Loopholes</a><a href="#quiz">Quiz</a><a href="#cards">Flashcards</a><a href="#updates">Updates</a><a href="#tutor">Ask tutor</a>
 </nav>
</header>
<main id="main"><div class="band"><div class="wrap"><p class="meta">Opening the library…</p></div></div></main>
<footer class="band"><div class="wrap note">Educational material on Indian law, not legal or tax advice. Each item names its source; check the source and a qualified CA or lawyer before acting.</div></footer>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url=u=>typeof u==='string'&&/^https:\/\//.test(u)?u:null;
const link=(s)=>{if(!s)return'';const u=url(s.u);return u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(s.t||u)}</a>`:esc(s.t||'')};
const COLS=['#232325','#2c2c2f','#1d1d1f','#333336','#262628','#2f2f31','#202022','#38383b'];
const HTS=[300,272,316,288,306,280,296,268];
const ST=s=>/closed|overruled|superseded|abolish|fail|lost|ousted|collaps|insolv|bankrupt|withdrawn|convicted/i.test(s||'')?'st-closed':/narrow|weak|limit|rework|partly|pending|ongoing|settled/i.test(s||'')?'st-narrow':'st-good';
const S={modules:[],lessons:[],cases:[],gaps:[],quiz:[],updates:[],stories:[],traps:[],meta:null,fTab:'stories',fOut:'all',
 prog:{lessons:{},quiz:{},cards:{},stories:{},seen:''},uid:null,db:null,state:'loading',
 q:'',focus:null,caseMod:'all',gapMod:'all',
 qz:{mod:'all',order:[],i:0,picked:null},cd:{i:0,flip:false,only:true,order:[]},chat:[],busy:false};
const mod=id=>S.modules.find(m=>m.id===id);
const modName=id=>mod(id)?.title||id||'';
const byOrder=(a,b)=>(a.order??99)-(b.order??99)||String(a.title||a.name||'').localeCompare(String(b.title||b.name||''));

/* ---------- progress ---------- */
let saveT=null,saving=Promise.resolve();
function saveProg(){clearTimeout(saveT);saveT=setTimeout(()=>{if(!S.db||!S.uid)return;
 const snap=JSON.parse(JSON.stringify(S.prog));
 saving=saving.then(()=>S.db.collection('data/users/'+S.uid).doc('progress').set(snap)).catch(()=>{})},700)}

/* ---------- search ---------- */
const STOP=new Set('the and for are was with that this from what how does into can its not but about under which when who why law india indian'.split(' '));
const toks=s=>String(s||'').toLowerCase().match(/[a-z0-9.()-]{3,}/g)?.filter(w=>!STOP.has(w))||[];
function corpus(){return[
 ...S.lessons.map(x=>({k:'Lesson',x,ti:x.title,tx:[x.summary,...(x.body||[]),...(x.keyPoints||[])].join(' '),go:'m-'+x.module})),
 ...S.cases.map(x=>({k:'Case',x,ti:x.name,tx:[x.court,x.year,x.citation,x.facts,x.held,x.why,x.status,(x.tags||[]).join(' ')].join(' '),go:'cases'})),
 ...S.gaps.map(x=>({k:'Loophole',x,ti:x.title,tx:[x.status,x.gap,x.used,x.closed,x.today,...(x.timeline||[]).map(t=>t.y+' '+t.e)].join(' '),go:'gaps'})),
 ...S.updates.map(x=>({k:'Update',x,ti:x.title,tx:[x.date,x.summary,x.kind].join(' '),go:'updates'})),
 ...S.stories.map(x=>({k:'Founder story',x,ti:x.name,tx:[x.who,x.country,x.year,x.kind,x.outcome,x.what,x.move,x.lesson,x.apply,x.status].join(' '),go:'founders'})),
 ...S.traps.map(x=>({k:'Term-sheet trap',x,ti:x.clause,tx:[x.looks,x.risk,x.ask,x.india].join(' '),go:'founders'}))]}
function rank(q,n){const qt=toks(q);if(!qt.length)return[];
 return corpus().map(c=>{const ti=c.ti.toLowerCase(),tx=(c.ti+' '+c.tx).toLowerCase();let s=0;
  for(const t of qt){if(ti.includes(t))s+=4;let i=tx.indexOf(t),k=0;while(i>-1&&k<6){s++;k++;i=tx.indexOf(t,i+1)}}
  if(tx.includes(q.toLowerCase().trim()))s+=6;return{...c,s}}).filter(c=>c.s>0).sort((a,b)=>b.s-a.s).slice(0,n)}

/* ---------- views ---------- */
function stampHtml(s){return s?`<span class="stamp ${ST(s)}">${esc(s)}</span>`:''}
function modProg(id){const ls=S.lessons.filter(l=>l.module===id);const d=ls.filter(l=>S.prog.lessons[l.id]).length;return{d,t:ls.length,p:ls.length?d/ls.length:0}}
function lastDate(){return S.updates.reduce((m,u)=>u.date>m?u.date:m,'')}
function fmtDate(d){if(!d)return'';const t=new Date(d+'T00:00:00');return isNaN(t)?esc(d):t.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}

function vHome(){
 const mods=[...S.modules].sort(byOrder);
 const spines=mods.map((m,i)=>{const p=modProg(m.id);return`<button class="spine" style="--c:${COLS[i%COLS.length]};height:${HTS[i%HTS.length]}px" data-go="m-${esc(m.id)}" aria-label="${esc(m.title)}: ${p.d} of ${p.t} lessons learned">
  <span class="rib" style="height:${Math.round(30+p.p*110)}px" aria-hidden="true"></span><span class="v">Vol. ${esc(m.vol||i+1)}</span><span class="bands"></span><span class="t">${esc(m.title)}</span><span class="bands"></span></button>`}).join('');
 const ups=[...S.updates].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5);
 const ld=S.lessons.filter(l=>S.prog.lessons[l.id]).length;
 const qa=Object.values(S.prog.quiz);const qr=qa.filter(v=>v===1).length;
 const ck=Object.values(S.prog.cards).filter(v=>v==='k').length;const sd=Object.keys(S.prog.stories||{}).length;
 const lc=S.meta?.lastChecked;
 return`<section class="hero band"><div class="wrap">
  <p class="eyebrow">Indian startup law · ${mods.length} volumes · updated daily</p>
  <h1>Know the rules.<br>Keep control.</h1>
  <p>Indian startup law, the court cases that set precedent, loopholes and how they were closed, foreign structures Indian startups use, and tax planning. A scheduled check adds new rulings, rules and budget changes as they appear.</p>
  <a class="cta" href="#map">Train now</a>
  <div class="status">${lc?`Last checked for new developments: <b>${fmtDate(lc)}</b> · `:''}<a href="#updates">${S.updates.length} tracked updates</a></div>
  <div class="shelf" role="group" aria-label="Volumes">${spines||'<p>No volumes yet.</p>'}</div>
 </div></section>
 <section class="band glow"><div class="wrap grid2">
  <div><p class="eyebrow" style="color:var(--mute)">Live feed</p><h2>What changed recently</h2><ul class="list">${ups.map(u=>`<li><p class="kicker">${fmtDate(u.date)} · ${esc(modName(u.module))}${u.date>S.prog.seen?'<span class="new">New</span>':''}</p><h3>${esc(u.title)}</h3><p style="margin:6px 0 0">${esc(u.summary)}</p></li>`).join('')||'<li class="meta">No updates yet.</li>'}</ul>
   <p><a class="btn" href="#updates">All updates</a></p></div>
  <div><p class="eyebrow" style="color:var(--mute)">Your stats</p><h2>Your progress</h2>
   <div class="stat"><span>Lessons learned</span><b>${ld}/${S.lessons.length}</b></div>
   <div class="stat"><span>Quiz accuracy</span><b>${qa.length?Math.round(qr/qa.length*100)+'%':'–'}</b></div>
   <div class="stat"><span>Flashcards known</span><b>${ck}</b></div>
   <div class="stat"><span>Founder stories studied</span><b>${sd}/${S.stories.length}</b></div>
   <div class="row" style="margin-top:16px"><a class="btn pri" href="#map">Open my mindmap</a><a class="btn" href="#quiz">Take a quiz</a><a class="btn" href="#tutor">Ask the tutor</a></div>
   <h3 style="margin-top:30px;text-transform:uppercase">Volumes</h3>

function vQuiz(){if(!S.qz.order.length||S.qz.order.some(id=>!S.quiz.find(q=>q.id===id)))startQuiz(S.qz.mod);const z=S.qz;
 const sel=`<label class="row">Volume <select id="qzmod"><option value="all">All volumes</option>${[...S.modules].sort(byOrder).map(m=>`<option value="${esc(m.id)}" ${z.mod===m.id?'selected':''}>${esc(m.title)}</option>`).join('')}</select></label>`;

 if(z.i>=z.order.length){const ids=z.order;const r=ids.filter(id=>S.prog.quiz[id]===1).length;
  return`<section class="band glow"><div class="wrap"><h1>Quiz done</h1><p style="font-size:20px">${r} of ${ids.length} right on the latest attempt of each.</p><div class="row">${sel}<button class="btn pri" data-restart="1">Go again</button></div></div></section>`}
 const q=S.quiz.find(x=>x.id===z.order[z.i]);const p=z.picked;
 return`<section class="band glow"><div class="wrap" style="max-width:820px"><div class="row" style="justify-content:space-between"><p class="kicker">Question ${z.i+1} of ${z.order.length} · ${esc(modName(q.module))}</p>${sel}</div>

function deck(){return[...S.cases.map(c=>({id:'c:'+c.id,f:c.name,f2:`${c.court} · ${c.year}`,b:c.held,b2:c.why})),...S.gaps.map(g=>({id:'g:'+g.id,f:g.title,f2:'Loophole · '+(g.status||''),b:g.closed,b2:g.today||''})),...S.stories.map(x=>({id:'s:'+x.id,f:x.name,f2:'Founder story · '+(x.outcome||''),b:x.lesson,b2:x.apply||''})),...S.traps.map(x=>({id:'t:'+x.id,f:x.clause,f2:'Term-sheet trap',b:x.risk,b2:'Ask for: '+(x.ask||'')}))]}
function vCards(){const d=deck();const c=S.cd;const pool=d.filter(x=>!c.only||S.prog.cards[x.id]!=='k');
 const head=`<div class="row" style="justify-content:space-between"><h1>Flashcards</h1><label class="row"><input type="checkbox" id="only" ${c.only?'checked':''} style="width:22px;height:22px"> Only cards I don’t know yet</label></div><p class="meta">${pool.length} in deck · ${Object.values(S.prog.cards).filter(v=>v==='k').length} known</p>`;
 if(!pool.length)return`<section class="band glow"><div class="wrap" style="max-width:820px">${head}<p>All cards known. Untick the box to review everything.</p></div></section>`;
 const x=pool[c.i%pool.length];
 return`<section class="band glow"><div class="wrap" style="max-width:820px">${head}
 <div class="card flash" data-flip="1" role="button" tabindex="0" aria-label="Flip card">${c.flip?`<p class="kicker">Answer</p><p style="font-size:18px;max-width:60ch;margin:0 auto">${esc(x.b)}</p>${x.b2?`<p class="meta" style="max-width:60ch;margin:10px auto 0">${esc(x.b2)}</p>`:''}`:`<p class="kicker">${esc(x.f2)}</p><h3>${esc(x.f)}</h3><p class="meta">What was held or changed? Tap to flip.</p>`}</div>

function branches(){const ms=[...S.modules].sort(byOrder).map((m,i)=>{const ls=S.lessons.filter(l=>l.module===m.id).sort(byOrder);
  return{id:m.id,title:m.title,vol:m.vol,c:COLS[i%COLS.length],go:'m-'+m.id,items:ls.map(l=>({id:l.id,t:l.title,on:!!S.prog.lessons[l.id],go:'m-'+m.id}))}});
 if(S.stories.length)ms.push({id:'_stories',title:'Founder stories',vol:'',c:'#b27b10',go:'founders',items:[...S.stories].sort(byOrder).map(x=>({id:x.id,t:x.short||x.name,on:!!S.prog.stories[x.id],go:'founders'}))});
 const qa=S.quiz.length?S.quiz.map(q=>({id:q.id,t:'Q'+q.id.replace(/\D/g,''),on:S.prog.quiz[q.id]===1,go:'quiz'})):[];
 if(qa.length)ms.push({id:'_quiz',title:'Quiz answered right',vol:'',c:'#2f6b4f',go:'quiz',items:qa,small:1});
 return ms}
function vMap(){const bs=branches();const all=bs.flatMap(b=>b.items);const on=all.filter(i=>i.on).length;const pct=all.length?Math.round(on/all.length*100):0;
 const half=Math.ceil(bs.length/2);const L=bs.slice(0,half),R=bs.slice(half);
 const br=(b,side)=>{const d=b.items.filter(i=>i.on).length;return`<div class="mm-br" data-side="${side}" data-c="${b.c}" style="--c:${b.c}"><button class="mm-head" data-go="${esc(b.go)}"><span class="nm">${b.vol?'Vol. '+esc(b.vol)+' · ':''}${esc(b.title)}</span><span>${d}/${b.items.length}</span></button>
  <div class="leaves">${b.items.map(i=>b.small?`<span class="leaf ${i.on?'on':''}" title="${esc(i.id)}">${esc(i.t)}</span>`:`<a class="leaf ${i.on?'on':''}" href="#${esc(i.go)}" data-focus="${esc(i.id)}" aria-label="${esc(i.t)}${i.on?' (done)':' (not yet)'}">${i.on?'✓ ':''}${esc(i.t)}</a>`).join('')}</div></div>`};
 const next=bs.filter(b=>!b.small).map(b=>({b,i:b.items.find(i=>!i.on)})).filter(x=>x.i).slice(0,5);
 return`<section class="band glow"><div class="wrap"><h1>Your progress mindmap</h1><p class="meta">${on} of ${all.length} items done across lessons, founder stories and quiz questions. Lime = done; dashed = still to learn. Tap any item to open it.</p>
 <div class="mm-wrap"><div class="mm" id="mm"><svg aria-hidden="true"></svg>
  <div class="mm-col L">${L.map(b=>br(b,'L')).join('')}</div>
  <div class="mm-root" id="mmroot" style="--p:${pct}"><div>Startup Law Library<b>${pct}%</b></div></div>
  <div class="mm-col R">${R.map(b=>br(b,'R')).join('')}</div></div></div>
 ${next.length?`<h2 style="margin-top:32px">Next up</h2><ul class="list">${next.map(x=>`<li><p class="kicker">${esc(x.b.title)}</p><a href="#${esc(x.i.go)}" data-focus="${esc(x.i.id)}"><b>${esc(x.i.t)}</b></a></li>`).join('')}</ul>`:'<p style="margin-top:24px"><b>Everything done.</b> New items appear here as the library updates.</p>'}
 </div></section>`}
let mmRO=null;
function drawMap(){const mm=$('#mm');if(!mm)return;const svg=mm.querySelector('svg');if(mm.clientWidth<820){svg.innerHTML='';return}
 const b=mm.getBoundingClientRect(),r=$('#mmroot').getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${b.width} ${b.height}`);
 svg.innerHTML=[...mm.querySelectorAll('.mm-br')].map(el=>{const h=el.getBoundingClientRect(),L=el.dataset.side==='L';
  const x1=(L?r.left:r.right)-b.left,y1=r.top+r.height/2-b.top,x2=(L?h.right:h.left)-b.left,y2=h.top+Math.min(28,h.height/2)-b.top,mx=(x1+x2)/2;
  return`<path d="M${x1} ${y1} C${mx} ${y1},${mx} ${y2},${x2} ${y2}" fill="none" stroke="#d8b56a" stroke-width="3" stroke-linecap="round" opacity=".85"/>`}).join('')}

function vFounders(){const OUT=['all','Lost','Kept control','Ongoing'];

 if(mmRO){mmRO.disconnect();mmRO=null}if($('#mm')){mmRO=new ResizeObserver(drawMap);mmRO.observe($('#mm'));drawMap()}
 if(S.focus){const el=document.getElementById('i-'+S.focus);if(el){el.scrollIntoView({block:'start'});if(el.tagName==='DETAILS')el.open=true}S.focus=null}
 if(v==='updates'&&S.state==='ready'){const ld=lastDate();if(ld&&ld>S.prog.seen){S.prog.seen=ld;saveProg()}}}
addEventListener('hashchange',()=>{if(S.q){S.q='';$('#q').value=''}const f=S.focus;render(true);if(!f)scrollTo(0,0)});

/* ---------- events ---------- */
let qT;$('#q').addEventListener('input',e=>{clearTimeout(qT);qT=setTimeout(()=>{S.q=e.target.value;render(true)},180)});
document.addEventListener('click',e=>{const t=e.target.closest('[data-study],[data-ftab],[data-fout],[data-go],[data-done],[data-focus],[data-cmod],[data-gmod],[data-pick],[data-next],[data-restart],[data-quizmod],[data-flip],[data-know],[data-again],[data-cprev],[data-ask],[data-clear]');if(!t)return;const d=t.dataset;
 if(d.focus){S.focus=d.focus;S.caseMod='all';S.gapMod='all';S.fOut='all';if(S.traps.some(t=>t.id===d.focus))S.fTab='traps';else if(S.stories.some(t=>t.id===d.focus))S.fTab='stories';if(d.clearq){S.q='';$('#q').value=''}if(location.hash===t.getAttribute('href')){e.preventDefault();render(true)}return}
 if(d.go){location.hash=d.go;return}
 if(d.study){S.prog.stories[d.study]?delete S.prog.stories[d.study]:S.prog.stories[d.study]=1;saveProg();S.focus=d.study;render(true);return}
 if(d.ftab){S.fTab=d.ftab;render(true);return}if(d.fout){S.fOut=d.fout;render(true);return}
 if(d.done){S.prog.lessons[d.done]?delete S.prog.lessons[d.done]:S.prog.lessons[d.done]=1;saveProg();S.focus=d.done;render(true);return}
 if(d.cmod){S.caseMod=d.cmod;render(true);return}if(d.gmod){S.gapMod=d.gmod;render(true);return}
 if(d.quizmod){startQuiz(d.quizmod);location.hash='quiz';return}
 if(d.pick!==undefined){const q=S.quiz.find(x=>x.id===S.qz.order[S.qz.i]);S.qz.picked=+d.pick;S.prog.quiz[q.id]=+d.pick===q.a?1:0;saveProg();render(true);return}
 if(d.next){S.qz.i++;S.qz.picked=null;render(true);scrollTo(0,0);return}
 if(d.restart){startQuiz(S.qz.mod);render(true);return}
 if(d.flip){S.cd.flip=!S.cd.flip;render(true);return}
 if(d.know){S.prog.cards[d.know]='k';S.cd.flip=false;if(!S.cd.only)S.cd.i++;saveProg();render(true);return}
 if(d.again){delete S.prog.cards[d.again];S.cd.flip=false;S.cd.i++;saveProg();render(true);return}
 if(d.cprev){S.cd.i=Math.max(0,S.cd.i-1);S.cd.flip=false;render(true);return}
 if(d.ask){ask(d.ask);return}
 if(d.clear){S.chat=[];render(true);return}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.flash')){e.preventDefault();S.cd.flip=!S.cd.flip;render(true);$('.flash')?.focus()}});
document.addEventListener('change',e=>{if(e.target.id==='qzmod'){startQuiz(e.target.value);render(true)}if(e.target.id==='only'){S.cd.only=e.target.checked;S.cd.i=0;S.cd.flip=false;render(true)}});
document.addEventListener('submit',e=>{if(e.target.id==='tform'){e.preventDefault();const v=$('#tq').value.trim();if(v)ask(v)}});

/* ---------- tutor ---------- */
function notesFor(q){const top=rank(q,9);const recent=[...S.updates].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,3).map(x=>({k:'Update',x,ti:x.title,tx:x.date+' '+x.summary}));
 const seen=new Set();return[...top,...recent].filter(c=>!seen.has(c.k+c.x.id)&&seen.add(c.k+c.x.id)).map(c=>`[${c.k}] ${c.ti}\n${c.tx.slice(0,1400)}`).join('\n\n')}
async function ask(text){if(S.busy)return;const sample=await claude.use('sample');
 if(!sample){const n=$('#tnote');if(n)n.innerHTML='<p class="banner">The tutor isn’t available in this view. Search and the volumes still work.</p>';return}
 S.chat.push({role:'user',content:text});S.chat.push({role:'assistant',content:'Thinking…'});S.busy=true;render(true);
 const box=document.querySelectorAll('.msg.a');const out=box[box.length-1];
 const instr=`You are the tutor inside a learning app on Indian startup law: company law, court cases and precedents, loopholes and how they were closed, foreign law and offshore structures used by Indian startups, and tax planning, plus a founder playbook of real founder failures, control fights and term-sheet traps. Today is ${new Date().toISOString().slice(0,10)}. The library was last checked for new developments on ${S.meta?.lastChecked||'unknown'}.
Rules:
1. Base the answer on the APP NOTES below. End with one line "From the library:" naming the note titles you used.
2. If the notes do not cover part of the question, say "Not covered in the library notes" for that part. You may add general background only if you label it "General background (verify)". Never invent case names, citations, section numbers, dates, rates or amounts.
3. The Income-tax Act, 2025 replaced the 1961 Act from 1 April 2026; mention both section numbers only when the notes give them.
4. Explain lawful planning and the anti-avoidance consequences; do not help conceal income or evade tax.
5. Educational, not legal or tax advice; for a real decision suggest a CA or lawyer in one short sentence.
6. Under 220 words unless the user asks for more. Plain text, short paragraphs or lines starting with "- ".

APP NOTES:
${notesFor(text)}`;
 const hist=S.chat.slice(0,-2).slice(-6);const msgs=[...hist,{role:'user',content:instr+'\n\nQUESTION: '+text}];
 try{const r=await sample(msgs,{cache:false,onText:({text})=>{if(out)out.textContent=text}});S.chat[S.chat.length-1].content=r.text+(r.truncated?'\n…(cut short)':'')}
 catch(err){S.chat[S.chat.length-1].content=err?.code==='rate_limited'?'Too many questions at once. Wait a minute and try again.':err?.code==='not_granted'?'The tutor needs permission to ask Claude. It was not granted.':'The tutor could not answer just now.'}
 S.busy=false;render(true);const c=$('#chat');c?.lastElementChild?.scrollIntoView({block:'nearest'})}

/* ---------- data ---------- */
(async()=>{const db=await claude.use('db');if(!db){S.state='nodb';render(true);return}S.db=db;
 const user=await claude.use('user');S.uid=user?await user.id():null;
 const timer=setTimeout(()=>{if(S.state==='loading'){S.state='slow';render(true)}},10000);
 const got=new Set();const NAMES=['modules','lessons','cases','gaps','quiz','updates','stories','traps'];
 const done=()=>{if(got.size===NAMES.length){clearTimeout(timer);S.state=S.modules.length?'ready':'empty'}};
 NAMES.forEach(n=>db.collection(n).onSnapshot(s=>{S[n]=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache)got.add(n);done();render()},()=>{got.add(n);done();render()}));
 db.doc('meta/info').onSnapshot(s=>{S.meta=s.exists?s.data():null;render()},()=>{});
 if(S.uid){try{const p=await db.collection('data/users/'+S.uid).doc('progress').get();if(p.exists){const d=p.data();S.prog={lessons:{...(d.lessons||{})},quiz:{...(d.quiz||{})},cards:{...(d.cards||{})},stories:{...(d.stories||{})},seen:d.seen||''};render()}}catch(e){}}
})();
render(true);
}
</script>
</body>
</html>
