name: Build Startup Law Android app

on:
  push:
    branches: [startup-law-android]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: startup-law-android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      app_changed: ${{ steps.changes.outputs.app_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 200

      - name: Did the app itself change?
        id: changes
        run: |
          git fetch -q --depth=200 origin "+refs/tags/startup-law-latest:refs/tags/startup-law-latest" || true
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             ! git rev-parse -q --verify startup-law-latest >/dev/null || \
             ! git merge-base --is-ancestor startup-law-latest HEAD || \
             git diff --name-only startup-law-latest HEAD | grep -qE '^(app/|build.gradle.kts|settings.gradle.kts|gradle.properties)'; then
            echo "app_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "app_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Keep the same fallback signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: startup-law-debug-keystore

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.STARTUP_LAW_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secret set; signing with the cached build key."
          fi

      - name: Bundle the newest signed library into the app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/lib"
          if gh release download startup-law-content -R "$GITHUB_REPOSITORY" -p content.json -p content.json.sig -D "$RUNNER_TEMP/lib" 2>/dev/null && [ -n "${KEYSTORE_PATH:-}" ]; then
            keytool -exportcert -rfc -alias startuplaw -keystore "$KEYSTORE_PATH" -storepass startuplaw > "$RUNNER_TEMP/cert.pem"
            openssl x509 -in "$RUNNER_TEMP/cert.pem" -pubkey -noout > "$RUNNER_TEMP/pub.pem"
            base64 -d "$RUNNER_TEMP/lib/content.json.sig" > "$RUNNER_TEMP/sig.bin"
            if openssl dgst -sha256 -verify "$RUNNER_TEMP/pub.pem" -signature "$RUNNER_TEMP/sig.bin" "$RUNNER_TEMP/lib/content.json"; then
              new=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('rev',0))" "$RUNNER_TEMP/lib/content.json")
              old=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('rev',0))" app/src/main/assets/content.json)
              echo "published library rev $new, bundled rev $old"
              if [ "$new" -gt "$old" ]; then cp "$RUNNER_TEMP/lib/content.json" app/src/main/assets/content.json; echo "Bundled published library."; fi
            else
              echo "::warning::Published library signature did not verify; keeping the copy in the repo."
            fi
          else
            echo "No published library yet; bundling the copy in the repo."
          fi

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build APKs
        run: |
          gradle assembleRelease assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk StartupLawLibrary.apk
          cp app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk app-debug-androidTest.apk
          ls -la *.apk

      - name: Unit test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests

      - uses: actions/upload-artifact@v4
        with:
          name: StartupLawLibrary-apk
          path: |
            StartupLawLibrary.apk
            app-debug.apk
            app-debug-androidTest.apk

  phone-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: StartupLawLibrary-apk

      - name: Get the build phones have now (to test updating over it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download startup-law-latest -R "$GITHUB_REPOSITORY" -p StartupLawLibrary.apk -O previous.apk || echo "no previous build"

      - name: Enable hardware acceleration for the virtual phone
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test on a virtual Pixel 6 (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          ram-size: 4096M
          heap-size: 576M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tests/emulator-test.sh

      - name: Bundle test results
        if: always()
        run: |
          mkdir -p test-shots
          zip -qr phone-test-results.zip test-shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-test-results
          path: phone-test-results.zip

      - name: Publish test results
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: startup-law-tests
          name: Startup Law app – latest phone test
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: phone-test-results.zip
          body: |
            Virtual-phone test for build ${{ github.run_number }} (${{ github.sha }}): ${{ job.status }}.

  publish:
    needs: [build, phone-test]
    if: needs.build.outputs.app_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: StartupLawLibrary-apk

      - name: Send to phones (publish download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: startup-law-latest
          name: Startup Law Library (Android)
          target_commitish: ${{ github.sha }}
          make_latest: false
          files: StartupLawLibrary.apk
          body: |
            Native offline-first Android app for the Startup Law Library. Install StartupLawLibrary.apk below.
            Passed the unit tests and the virtual-phone test before publishing.
            Build ${{ github.run_number }} from ${{ github.sha }}.
            versionCode: ${{ github.run_number }}
