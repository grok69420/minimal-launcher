name: Build Startup Law Android app

on:
  push:
    branches: [startup-law-android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Keep the same signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: startup-law-debug-keystore

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.STARTUP_LAW_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secret set; signing with the cached build key. Add the STARTUP_LAW_KEYSTORE_BASE64 secret for a permanent key."
          fi

      - name: Build APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk StartupLawLibrary.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StartupLawLibrary-apk
          path: StartupLawLibrary.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: startup-law-latest
          name: Startup Law Library (Android)
          target_commitish: ${{ github.sha }}
          make_latest: false
          files: StartupLawLibrary.apk
          body: |
            Android app for the Startup Law Library. Install StartupLawLibrary.apk below.
            The app loads the live library, so design and content changes appear without reinstalling.
            Build ${{ github.run_number }} from ${{ github.sha }}.
            versionCode: ${{ github.run_number }}
